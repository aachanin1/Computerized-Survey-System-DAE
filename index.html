<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบสำรวจคอมพิวเตอร์ ชอ.</title>
  <link rel="icon" href="https://img.icons8.com/color/48/computer.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/48/computer.png">
  <style>
    html,body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f6fa; }
    #mainIframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
  </style>
  <script>
    // Support browsers without ancestorOrigins. Only the expected Apps Script
    // child can receive this acknowledgement, and the survey verifies our origin.
    window.addEventListener('message', event => {
      if(!/^https:\/\/n-[a-z0-9-]+-script\.googleusercontent\.com$/.test(event.origin))return;
      if(event.data?.type!=='chor:embed-check'||typeof event.data.nonce!=='string'||
        !/^[a-f0-9-]{36}$/.test(event.data.nonce)||!event.source)return;
      event.source.postMessage({type:'chor:embed-accepted',nonce:event.data.nonce},event.origin);
    });
  </script>
</head>
<body>
  <iframe id="mainIframe" title="ระบบสำรวจคอมพิวเตอร์ ชอ." allow="clipboard-write" src="https://script.google.com/macros/s/AKfycbz92U60HsvATmCepeTrWp7TxfRZ5sJ3JOPTk3Qd2aFihLPKcv7ZQJCYSBJsJlrati_r/exec"></iframe>
</body>
</html>
